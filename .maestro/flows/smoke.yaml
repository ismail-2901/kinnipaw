appId: com.kinnipaw.app
---
- launchApp
- assertVisible: "KINNIPAW"
- assertVisible: "One Platform. Every Animal. One Connected Ecosystem."

# Navigate to Community Feed
- tapOn: "Community Feed"
- assertVisible: "Community Feed"

# Navigate to Adoption
- tapOn: "Adopt"
- assertVisible: "Lawful Adoption"

# Navigate to Lost & Found
- tapOn: "Lost/Found"
- assertVisible: "Lost & Found"
- assertVisible: "Lost Pets"
- assertVisible: "Found Animals"

# Navigate to Rescue
- tapOn: "Rescue"
- assertVisible: "Wildlife Incident Protocol"
- assertVisible: "01999000095"

# Navigate to Providers
- tapOn: "Providers"
- assertVisible: "Care Providers"

# Return to Home
- back
- assertVisible: "KINNIPAW"
